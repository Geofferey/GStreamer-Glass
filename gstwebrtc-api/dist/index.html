<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glass Live">
  <title>GStreamer Glass Live</title>
  <!-- Keep this URL stable: installed PWAs associate manifest updates with it. -->
  <link rel="manifest" href="./manifest.webmanifest?v=3.8.40" crossorigin="use-credentials">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/gstreamer-glass-192.png">
  <link rel="apple-touch-icon" href="./icons/gstreamer-glass-192.png">
  <link rel="stylesheet" href="./player.css?v=3.8.27">
</head>
<body>
  <main id="playerRoot" class="playerRoot">
    <video id="video" autoplay playsinline muted></video>

    <button id="fullscreenButton" class="fullscreenButton" type="button" aria-label="Enter fullscreen">
      <span class="fsIcon">⛶</span>
      <span class="fsText">Fullscreen</span>
    </button>

    <div id="overlay" class="overlay">
      <div class="brand">GStreamer Glass</div>
      <div id="status" class="status">Connecting…</div>
      <div id="detail" class="detail" hidden></div>
    </div>

    <div id="statsOverlay" class="statsOverlay">stats pending</div>

    <div id="viewerUtilityBar" class="viewerUtilityBar">
      <a id="debugLink" class="debugLink" href="./debug/" title="Open Direct WebRTC debug interface">debug</a>
      <button id="viewerSettingsButton" class="viewerSettingsButton" type="button" title="Viewer display settings" aria-label="Viewer display settings" aria-expanded="false" aria-controls="viewerSettingsPanel">⚙</button>
    </div>

    <section id="viewerSettingsPanel" class="viewerSettingsPanel" aria-label="Viewer display settings" hidden>
      <div class="viewerSettingsHeader">
        <strong>Viewer display</strong>
        <button id="viewerSettingsClose" class="viewerSettingsClose" type="button" aria-label="Close viewer settings">×</button>
      </div>
      <label><input id="viewerSettingStatus" type="checkbox"> Status messages</label>
      <label><input id="viewerSettingStats" type="checkbox"> Connection statistics</label>
      <label><input id="viewerSettingControls" type="checkbox"> Playback controls</label>
      <label><input id="viewerSettingDebug" type="checkbox"> Debug shortcut</label>
      <button id="viewerSettingsReset" class="viewerSettingsReset" type="button">Reset display settings</button>
    </section>
  </main>

  <script src="./logout.js?v=3.8.42"></script>
  <script>
    (() => {
      const configScript = document.createElement('script');
      configScript.src = `./gstglass-config.js?t=${Date.now()}`;
      configScript.onload = loadFrontend;
      configScript.onerror = loadFrontend;
      document.body.appendChild(configScript);

      function loadFrontend() {
        const frontendScript = document.createElement('script');
        frontendScript.src = `./player.js?v=3.8&t=${Date.now()}`;
        document.body.appendChild(frontendScript);
      }
    })();
  </script>
</body>
</html>
