<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Glass2Glass - Setup</title>
<style>
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070b;color:#e8edf5;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
    radial-gradient(560px circle at 18% 20%,rgba(79,140,255,.40),transparent 60%),
    radial-gradient(520px circle at 85% 75%,rgba(53,215,137,.30),transparent 58%),
    radial-gradient(640px circle at 60% 100%,rgba(255,93,108,.20),transparent 60%),
    #05070b}
main{width:min(92vw,420px);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:linear-gradient(180deg,rgba(10,14,22,.82),rgba(10,14,22,.48));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 44px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:1.55rem}
p{color:#aab6c8}
.error{color:#ff9b9b;display:none;margin:0 0 8px}
label{display:block;margin:18px 0 6px;font-weight:650}
input{width:100%;padding:12px;border:1px solid #35435a;border-radius:9px;background:#090f19;color:#fff;font:inherit}
.checkboxRow{display:flex;align-items:flex-start;gap:10px;margin:30px 0 0;font-weight:500}
.checkboxRow input{width:auto;padding:0;margin:3px 0 0 5px}
.checkboxRow span{color:#aab6c8;font-size:.92rem}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:#4f8cff;color:white;font:inherit;font-weight:750;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Glass2Glass</h1>
<p>Enter the address of your GStreamer Glass server to get started.</p>
<p class="error" id="error">Enter a valid server address.</p>
<form id="setupForm">
<label for="serverUrl">Server URL</label>
<input id="serverUrl" name="serverUrl" type="text" inputmode="url" autocomplete="url" placeholder="stream.example.com" required autofocus>
<label class="checkboxRow" for="insecure">
<input id="insecure" name="insecure" type="checkbox">
<span>Allow insecure connections</span>
</label>
<button type="submit">Connect</button>
</form>
</main>
<script>
var form = document.getElementById('setupForm');
var button = form.querySelector('button');
var error = document.getElementById('error');

window.__glassViewerSetupError = function (message) {
  error.textContent = message;
  error.style.display = 'block';
  button.disabled = false;
  button.textContent = 'Connect';
};

form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (button.disabled) return;
  var input = document.getElementById('serverUrl');
  var value = input.value.trim();
  var insecure = document.getElementById('insecure').checked;
  // Accept a bare domain (defaults to https://) as well as a full URL. http:// is only used
  // when the user actually typed it that way, and only if they've opted into insecure mode -
  // it's never silently upgraded or downgraded.
  if (!/^https?:\/\//i.test(value)) {
    value = 'https://' + value;
  }
  if (/^http:\/\//i.test(value) && !insecure) {
    window.__glassViewerSetupError('Check "Allow insecure connection(s)" to use http://.');
    return;
  }
  if (!/^https?:\/\/.+/i.test(value)) {
    window.__glassViewerSetupError('Enter a valid server address.');
    return;
  }
  error.style.display = 'none';
  button.disabled = true;
  button.textContent = 'Checking server...';
  if (window.GlassViewer && window.GlassViewer.onServerUrlSubmitted) {
    window.GlassViewer.onServerUrlSubmitted(value, insecure);
  }
});
</script>
</body>
</html>
