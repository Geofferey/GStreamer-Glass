<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Glass2Glass - Setup</title>
<style>
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070b;color:#e8edf5;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
    radial-gradient(560px circle at 18% 20%,rgba(79,140,255,.40),transparent 60%),
    radial-gradient(520px circle at 85% 75%,rgba(53,215,137,.30),transparent 58%),
    radial-gradient(640px circle at 60% 100%,rgba(255,93,108,.20),transparent 60%),
    #05070b}
main{width:min(92vw,420px);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:linear-gradient(180deg,rgba(10,14,22,.82),rgba(10,14,22,.48));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 44px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:1.55rem}
p{color:#aab6c8}
.error{color:#ff9b9b;display:none;margin:0 0 8px}
label{display:block;margin:18px 0 6px;font-weight:650}
input{width:100%;padding:12px;border:1px solid #35435a;border-radius:9px;background:#090f19;color:#fff;font:inherit}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:#4f8cff;color:white;font:inherit;font-weight:750;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Glass2Glass</h1>
<p>Enter the address of your GStreamer Glass server to get started.</p>
<p class="error" id="error">Enter a valid http(s) URL.</p>
<form id="setupForm">
<label for="serverUrl">Server URL</label>
<input id="serverUrl" name="serverUrl" type="text" inputmode="url" autocomplete="url" placeholder="https://stream.example.com/" required autofocus>
<button type="submit">Connect</button>
</form>
</main>
<script>
document.getElementById('setupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var input = document.getElementById('serverUrl');
  var value = input.value.trim();
  if (!/^https?:\/\/.+/i.test(value)) {
    document.getElementById('error').style.display = 'block';
    return;
  }
  if (window.GlassViewer && window.GlassViewer.onServerUrlSubmitted) {
    window.GlassViewer.onServerUrlSubmitted(value);
  }
});
</script>
</body>
</html>
